services:
  sai-monitor:
    build:
      context: .
    image: sai-monitor:latest
    container_name: sai-monitor
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    environment:
      SAI_PORT: /dev/ttyUSB0
      SAI_NAME: "${SAI_NAME:-Megatec/Q1 UPS}"
      SAI_WEB_TITLE: "${SAI_WEB_TITLE:-UPS Monitor}"
      SAI_INTERVAL: "${SAI_INTERVAL:-1}"
      SAI_DB: "${SAI_DB:-/data/sai.db}"
      SAI_RETENTION_DAYS: "${SAI_RETENTION_DAYS:-30}"
      SAI_SIMULATE: "${SAI_SIMULATE:-0}"
      SAI_BATTERY_NOMINAL: "${SAI_BATTERY_NOMINAL:-12}"
      SAI_BATTERY_AH: "${SAI_BATTERY_AH:-7}"
      SAI_BATTERY_LOW: "${SAI_BATTERY_LOW:-}"
      SAI_BATTERY_HIGH: "${SAI_BATTERY_HIGH:-}"
      SAI_BATTERY_STATE_LOW_V: "${SAI_BATTERY_STATE_LOW_V:-}"
      SAI_BATTERY_STATE_CHARGED_V: "${SAI_BATTERY_STATE_CHARGED_V:-}"
      SAI_BATTERY_STATE_CHARGING_V: "${SAI_BATTERY_STATE_CHARGING_V:-}"
      SAI_UPS_VA: "${SAI_UPS_VA:-650}"
      SAI_UPS_WATTS: "${SAI_UPS_WATTS:-360}"
      SAI_LOG_LEVEL: "${SAI_LOG_LEVEL:-INFO}"
      TZ: "${TZ:-UTC}"

    devices:
      - "${SAI_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"

    group_add:
      - "${SAI_DIALOUT_GID:-20}"

    volumes:
      - sai_data:/data

    # No port mapping: open the dashboard directly at
    # http://SAI_CONTAINER_IP:8000 from another device on the LAN.
    networks:
      sai_net:
        ipv4_address: "${SAI_CONTAINER_IP:-192.168.1.50}"

volumes:
  sai_data:
    name: sai_monitor_data

networks:
  sai_net:
    external: true
    name: "${SAI_NETWORK_NAME:-sai_macvlan}"
